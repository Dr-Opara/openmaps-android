name: Android CI

on:
  pull_request:
    branches:
      - production/platform-v1

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lint

      - name: Community reports production acceptance
        if: ${{ hashFiles('scripts/production-community-reports-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-community-reports-acceptance.ps1

      - name: Trip sharing production acceptance
        if: ${{ hashFiles('scripts/production-trip-sharing-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-trip-sharing-acceptance.ps1

      - name: Places production acceptance
        if: ${{ hashFiles('scripts/production-places-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-places-acceptance.ps1
