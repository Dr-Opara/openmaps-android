name: Android CI

on:
  pull_request:
    branches:
      - production/platform-v1

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # Device acceptance only: make the tested APK available without requiring a local build.
      # This test branch is never approved for merging into production.
      - name: Upload debug APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: openmaps-live-ui-device-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Compile release bundle
        run: ./gradlew bundleRelease

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Surfaces failing unit tests as check annotations (readable without downloading raw logs).
      - name: Annotate failing unit tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or (bad.text or '')).replace('%', ' ').replace('\r', ' ').replace('\n', ' ')[:600]
                      print(f"::error title=Unit test failed::{case.get('classname')}.{case.get('name')}: {msg}")
                      n += 1
          print(f"{n} failing test case(s)")
          PY

      - name: Lint
        run: ./gradlew lint

      - name: Production backend gateway acceptance
        if: ${{ hashFiles('scripts/production-backend-gateway-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-backend-gateway-acceptance.ps1

      - name: Reliability observability acceptance
        if: ${{ hashFiles('scripts/production-reliability-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-reliability-acceptance.ps1

      - name: Offline degraded-operation acceptance
        if: ${{ hashFiles('scripts/production-offline-degraded-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-offline-degraded-acceptance.ps1

      - name: Android release hardening acceptance
        if: ${{ hashFiles('scripts/production-android-release-hardening-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-android-release-hardening-acceptance.ps1

      - name: Release artifact structural acceptance
        if: ${{ hashFiles('scripts/production-release-artifact-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-release-artifact-acceptance.ps1

      - name: Regional capability matrix acceptance
        if: ${{ hashFiles('scripts/production-regional-capability-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-regional-capability-acceptance.ps1

      - name: Privacy security acceptance
        if: ${{ hashFiles('scripts/production-privacy-security-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-privacy-security-acceptance.ps1

      - name: ARCore geospatial structural acceptance
        if: ${{ hashFiles('scripts/production-arcore-geospatial-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-arcore-geospatial-acceptance.ps1

      - name: Map platform cartography acceptance
        if: ${{ hashFiles('scripts/production-map-platform-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-map-platform-acceptance.ps1

      - name: Worldwide localization acceptance
        if: ${{ hashFiles('scripts/production-localization-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-localization-acceptance.ps1

      - name: Community reports production acceptance
        if: ${{ hashFiles('scripts/production-community-reports-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-community-reports-acceptance.ps1

      - name: Trip sharing production acceptance
        if: ${{ hashFiles('scripts/production-trip-sharing-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-trip-sharing-acceptance.ps1

      - name: Places production acceptance
        if: ${{ hashFiles('scripts/production-places-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-places-acceptance.ps1

      - name: Human-quality voice production acceptance
        if: ${{ hashFiles('scripts/production-voice-acceptance.ps1') != '' }}
        shell: pwsh
        run: ./scripts/production-voice-acceptance.ps1
