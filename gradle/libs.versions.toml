[versions]
# Versions are deliberately conservative (known-released as of the author's
# knowledge). They could NOT be resolved in the remote build environment
# (egress to Google Maven / Maven Central is blocked there). Verify on first
# sync in Android Studio and bump as you like.
agp = "8.7.3"
# Bumped from 2.0.21 for the Places UI Kit addition below: places:5.0.0 transitively requires
# kotlin-stdlib 2.1.0, and Gradle resolves to the higher version regardless of this plugin's own
# pin, which made compileDebugKotlin hard-fail ("Internal compiler error") at 2.0.21. Confirmed by
# an actual local build (see docs/SETUP.md "Google Places UI Kit provisioning"), not guessed.
kotlin = "2.1.0"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
coreSplashscreen = "1.0.1"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coroutines = "1.9.0"
maplibre = "11.13.5"
camerax = "1.4.2"
# ARCore (Phase 6, spatial localization). Latest stable; requires minSdk 24 (we are 26) and is
# ARM64 + x86_64 device compatible. Support is ALWAYS runtime-checked (ArCoreApk), never assumed.
arcore = "1.56.0"
# Required by ARCore's Geospatial mode at runtime (not just transitively) — Session.configure()
# throws GooglePlayServicesLocationLibraryNotLinkedException with GeospatialMode.ENABLED otherwise.
# Confirmed on a physical device in Phase 12A; see ARCHITECTURE.md "AR stuck at Idle" for the trace.
playServicesLocation = "21.3.0"
junit = "4.13.2"
json = "20260814"
# androidx.fragment: MainActivity needs a FragmentManager to host the Google Places UI Kit's
# PlaceDetailsFragment (Phase 1, Issue #78), which is an androidx.fragment.app.Fragment.
fragment = "1.8.5"
# Google Places SDK for Android (New). Place Details UI Kit widget only; MapLibre remains the
# map renderer. See docs/SETUP.md "Google Places UI Kit provisioning" for the Cloud Console side.
# Pinned to 5.0.0, not the latest 6.0.2: 6.0.2 transitively pulls kotlin-stdlib 2.4.0, which no
# available Kotlin Gradle plugin in this project's AGP 8.7.3 line can compile against yet. 5.0.0
# still ships the full PlaceDetailsFragment widget (confirmed via its AAR's class list) at the
# more moderate kotlin-stdlib 2.1.0 floor. Revisit once the Kotlin version is bumped further.
googlePlaces = "5.0.0"
# LatLng only (PlaceDetailsCompactFragment.loadWithCoordinates takes a
# com.google.android.gms.maps.model.LatLng). Declared explicitly rather than relying on it being
# pulled in transitively by the places artifact above.
playServicesMaps = "19.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

maplibre-android = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

# CameraX: rear-camera preview for the Live screen (Phase 5).
# All four artifacts move together; camera-view brings PreviewView, the Compose host.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# ARCore (Phase 6). Supplies Geospatial (Earth) tracking. The app checks support at runtime via
# ArCoreApk and only constructs a Session when ARCore can actually run; otherwise it stays on the
# CameraX path. `optional = true` in the manifest keeps the app installable without ARCore.
google-ar-core = { group = "com.google.ar", name = "core", version.ref = "arcore" }
google-play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }

androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

# Places UI Kit (Phase 1, Issue #78): the Place Details widget only, not Autocomplete/Search.
# Runtime-gated on GOOGLE_PLACES_API_KEY being configured; absent key -> feature stays hidden.
google-places = { group = "com.google.android.libraries.places", name = "places", version.ref = "googlePlaces" }
google-play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
